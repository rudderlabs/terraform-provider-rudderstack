name: E2E Staging Smoke

permissions:
  contents: read

# Applies REAL resources to the staging workspace (BigQuery account → rETL
# source → connection), asserts no drift, destroys them on exit — the CI
# counterpart of test/e2e/run.sh (the #274 black-box smoke).
#
# Triggers:
#   - pull_request, gated by the `e2e-staging` label — runnable on a PR BEFORE
#     merge. For pull_request, GitHub reads this workflow from the PR HEAD, so
#     it works even though the file isn't on the default branch yet. Add the
#     label to run; pushes re-run while it's present.
#   - workflow_dispatch — manual runs once this file is on the default branch
#     (post-merge). Dispatch is NOT available pre-merge: GitHub lists dispatch
#     workflows from the default branch only.
#
# Opt-in (label/manual), never automatic on every push. run.sh folds a per-run
# token into the tf-e2e-* resource names so runs don't collide by name; the
# concurrency group still serializes to avoid overlapping staging applies.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: e2e-staging-smoke
  cancel-in-progress: false

jobs:
  staging-smoke:
    # Always on manual dispatch; on a PR only when the `e2e-staging` label is set.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-staging')
    runs-on: ubuntu-latest
    environment: e2e
    # Each scenario (customerio, customerio_audience, …) runs a full
    # init/apply/assert/destroy in turn, so wall time scales with scenario count.
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Run staging smoke (apply → assert no drift → destroy)
        # Creds come from the `e2e` GitHub Environment. bq_credentials is passed
        # via TF_VAR_ (not the tfvars file) to avoid embedding the JSON key.
        # If the staging token is unset the job no-ops (skips) rather than
        # failing — same pattern as RUDDERSTACK_RETL_TEST_ACCOUNT_ID. PAUSE is
        # intentionally not set: the hold-open path is for local runs only.
        env:
          STAGING_ACCESS_TOKEN: ${{ secrets.RUDDERSTACK_STAGING_ACCESS_TOKEN }}
          STAGING_API_URL: ${{ vars.RUDDERSTACK_STAGING_API_URL }}
          BQ_PROJECT: ${{ vars.RUDDERSTACK_STAGING_BQ_PROJECT }}
          BQ_DATASET: ${{ vars.RUDDERSTACK_STAGING_BQ_DATASET }}
          BQ_TABLE: ${{ vars.RUDDERSTACK_STAGING_BQ_TABLE }}
          TF_VAR_bq_credentials: ${{ secrets.RUDDERSTACK_STAGING_BQ_CREDENTIALS }}
          # Vendor creds are optional — each scenario runs only when its creds are
          # present (the run step selects the scenario list below); missing creds
          # skip that scenario instead of failing the smoke.
          CUSTOMERIO_SITE_ID: ${{ secrets.RUDDERSTACK_STAGING_CUSTOMERIO_SITE_ID }}
          CUSTOMERIO_DATACENTER: ${{ vars.RUDDERSTACK_STAGING_CUSTOMERIO_DATACENTER }}
          CUSTOMERIO_API_KEY: ${{ secrets.RUDDERSTACK_STAGING_CUSTOMERIO_API_KEY }}
          TF_VAR_customerio_api_key: ${{ secrets.RUDDERSTACK_STAGING_CUSTOMERIO_API_KEY }}
          CUSTOMERIO_AUDIENCE_ID: ${{ vars.RUDDERSTACK_STAGING_CUSTOMERIO_AUDIENCE_ID }}
          CUSTOMERIO_AUDIENCE_REGION: ${{ vars.RUDDERSTACK_STAGING_CUSTOMERIO_AUDIENCE_REGION }}
          CUSTOMERIO_APP_API_KEY: ${{ secrets.RUDDERSTACK_STAGING_CUSTOMERIO_APP_API_KEY }}
          TF_VAR_customerio_audience_app_api_key: ${{ secrets.RUDDERSTACK_STAGING_CUSTOMERIO_APP_API_KEY }}
        run: |
          if [ -z "$STAGING_ACCESS_TOKEN" ]; then
            echo "RUDDERSTACK_STAGING_ACCESS_TOKEN is not set on the e2e environment; skipping staging smoke."
            exit 0
          fi
          cat > test/e2e/secret.tfvars <<EOF
          access_token = "$STAGING_ACCESS_TOKEN"
          api_url      = "${STAGING_API_URL:-https://api.staging.rudderlabs.com}"
          bq_project   = "$BQ_PROJECT"
          bq_dataset   = "$BQ_DATASET"
          bq_table     = "$BQ_TABLE"
          customerio_site_id    = "$CUSTOMERIO_SITE_ID"
          customerio_datacenter = "${CUSTOMERIO_DATACENTER:-US}"
          customerio_audience_id     = ${CUSTOMERIO_AUDIENCE_ID:-0}
          customerio_audience_region = "${CUSTOMERIO_AUDIENCE_REGION:-US}"
          EOF
          # Select scenarios by available creds: each scenario is a unit that
          # applies (or fails) — it no longer self-skips — so only run the ones
          # whose vendor creds are configured on the e2e environment.
          SCENARIOS=()
          if [ -n "$CUSTOMERIO_SITE_ID" ] && [ -n "$CUSTOMERIO_API_KEY" ]; then
            SCENARIOS+=("customerio")
          fi
          if [ -n "$CUSTOMERIO_SITE_ID" ] && [ -n "$CUSTOMERIO_API_KEY" ] \
             && [ -n "$CUSTOMERIO_APP_API_KEY" ] && [ "${CUSTOMERIO_AUDIENCE_ID:-0}" != "0" ]; then
            SCENARIOS+=("customerio_audience")
          fi
          if [ ${#SCENARIOS[@]} -eq 0 ]; then
            echo "No vendor creds configured on the e2e environment; skipping staging smoke."
            exit 0
          fi
          echo "Running scenarios: ${SCENARIOS[*]}"
          bash test/e2e/run.sh --tfvars test/e2e/secret.tfvars "${SCENARIOS[@]}"
